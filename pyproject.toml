[project]
name = "investor-match"
version = "1.0.0"
description = "TEN Capital Investor Match - pitch deck to ranked investor contact list and one-page PDF."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "python-pptx>=1.0",
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "reportlab>=4.2",
    "pillow>=10.0",
    "rapidfuzz>=3.6",
    "streamlit>=1.40",
    "rapidocr-onnxruntime>=1.2",
]

[project.optional-dependencies]
google = ["gspread>=6.0", "google-auth>=2.30"]
llm = ["anthropic>=0.116,<1"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
